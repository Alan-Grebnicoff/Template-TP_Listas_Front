<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="filtros">
    <input type="search" id="buscador" placeholder="Busca utilizando texto" class="unFiltro">
      <select id="filtrarCategoria" class="unFiltro">
        <option value="">Todas las categorías</option>
      </select>
      <select id="filtrarProvincia" class="unFiltro">
        <option value="">Todas las provincias</option>
      </select>
    </header>


    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>    


    <section class="addFood">
      <!-- Para el form para agregar comida -->
       <form id="agregarComidaForm">
        <h2>Agregar Comida</h2>
        <label for="nombre">Nombre de la comida</label>
        <input type="text" id="nombre" placeholder="Pon una comida" required>
        <label for="provincia">¿De qué provincia es?</label>
        <input type="text" id="provincia" placeholder="Pon su provincia de origen" required>
        <label for="categoria">¿Cuál es su categoría?</label>
        <input type="text" id="categoria" placeholder="Pon una categoría" required>
        <label for="ingredientes">¿Cuáles son sus ingredientes (separados por comas)?</label>
        <div class="contenedor-ingredientes">
        <input type="text" class="ingrediente" id="ingredientes" placeholder="Pon los ingredientes" required>
        </div>
        <button type="button" id="boton-ingredientes">Agregar ingredientes</button>
        <button type="submit">Agregar</button>
       </form>
    </section>


    <script type="module" src="./main.js"></script>
</body>
</html>
